name: CI

# This repo lives on a personal account and is public, so Actions minutes
# (including the macOS runner) are free and bill nobody.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SC2034: OVERAGE_PERMITTED is parsed from the API but intentionally unused
      - name: shellcheck
        run: shellcheck --exclude=SC2034 quotapace.5m.sh install.sh helpers/quotapace-login.sh tests/run.sh
      - name: bash syntax
        run: bash -n quotapace.5m.sh install.sh helpers/quotapace-login.sh tests/run.sh

  test:
    # The plugin targets macOS (BSD date, SwiftBar), so the integration
    # tests need a macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: integration tests
        run: ./tests/run.sh
